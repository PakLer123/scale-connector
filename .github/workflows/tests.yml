name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Run unit tests
        working-directory: GradleScaleConnector
        # The Swing view tests need a (virtual) display
        run: xvfb-run ./gradlew build
      - name: Build simulator
        working-directory: SCSimulator
        run: ./gradlew build
