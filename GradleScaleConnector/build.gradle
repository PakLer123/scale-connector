plugins {
    id 'java'
    id 'application'
    id 'edu.sc.seis.launch4j' version '3.0.6'
}

group = 'com.ingeint.scaleconnector'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.ingeint.scaleconnector.gui.app.Main'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'org.jline:jline:3.25.0'
    implementation 'com.fazecast:jSerialComm:2.9.2'
    implementation 'com.formdev:flatlaf:2.0'
    implementation 'com.miglayout:miglayout-swing:5.2'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testImplementation 'org.mockito:mockito-core:5.0.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.0.0'
    testImplementation 'org.mockito:mockito-inline:5.0.0'
    testImplementation 'net.bytebuddy:byte-buddy:1.12.20'
    testImplementation 'net.bytebuddy:byte-buddy-agent:1.12.20'
}

