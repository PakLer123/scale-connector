plugins {
    id 'java'
    id 'application'
}

group = 'com.ingeint.scaleconnector'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    mockitoAgent
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.fazecast:jSerialComm:2.11.4'
    implementation 'com.formdev:flatlaf:3.8'
    implementation 'com.miglayout:miglayout-swing:11.5.2'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    mockitoAgent('org.mockito:mockito-core:5.24.0') {
        transitive = false
    }
}

// jSerialComm loads a native library; allow it without warnings on Java 24+
def nativeAccess = '--enable-native-access=ALL-UNNAMED'

application {
    mainClass = 'com.ingeint.scaleconnector.gui.app.Main'
    applicationDefaultJvmArgs = [nativeAccess]
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:removal']
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.ingeint.scaleconnector.gui.app.Main',
                'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    useJUnitPlatform()
    // Load Mockito as an agent instead of self-attaching, which newer JDKs warn about
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}", nativeAccess
}
